version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 20
    versioning-strategy: increase
    # Wait for new releases to age before opening PRs. Kept in step with
    # `minimumReleaseAge` in pnpm-workspace.yaml, so Dependabot never proposes a
    # version that pnpm would then refuse to resolve.
    cooldown:
      default-days: 1
      semver-major-days: 1
      semver-minor-days: 1
      semver-patch-days: 1
    labels:
      - dependencies
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    ignore:
      # eslint-config-next pulls in eslint-plugin-react, whose latest release
      # (7.37.5) does not support ESLint 10 (it uses the removed
      # context.getFilename() API). Block ESLint major bumps until upstream
      # adds ESLint 10 support.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript-eslint does not support TypeScript 7 yet (lint crashes with
      # "Cannot read properties of undefined (reading 'Cjs')"). Block TS major
      # bumps until the ESLint toolchain supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "prettier-plugin-tailwindcss"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@vitejs/plugin-react"
          - "@testing-library/*"
          - "jsdom"
      linting:
        patterns:
          - "eslint"
          - "eslint-*"
          - "prettier"
          - "@commitlint/*"
          - "lint-staged"
          - "husky"
      types:
        patterns:
          - "@types/*"
      # Catch-alls, matched last. Every minor/patch bump not claimed by a group
      # above lands in one PR per dependency type instead of one per package,
      # which keeps review and CI cost bounded. Majors stay ungrouped so they
      # can be reviewed and reverted on their own.
      production-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 1
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
