version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 20
    versioning-strategy: increase
    # Wait for new releases to age before opening PRs. Kept in step with
    # `minimumReleaseAge` in pnpm-workspace.yaml, so Dependabot never proposes a
    # version that pnpm would then refuse to resolve.
    cooldown:
      default-days: 1
      semver-major-days: 1
      semver-minor-days: 1
      semver-patch-days: 1
    labels:
      - dependencies
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    ignore:
      # Both entries below are peer-range blocks, so each has an exact recheck:
      # read the peer range off the named package and drop the entry when the
      # version we would bump to falls inside it. Re-verified 2026-08-15.
      #
      # eslint-config-next pulls in eslint-plugin-react, still latest at 7.37.5,
      # which peers `^3 || ... || ^9.7` — no ESLint 10 (it uses the removed
      # context.getFilename() API). typescript-eslint already peers ^10, so this
      # one package is the whole blocker.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8.67.0 peers `typescript >=4.8.4 <6.1.0`. This mirrors that
      # ceiling instead of blocking majors, because the range breaks at a *minor*:
      # TS 7 crashes the lint run outright ("Cannot read properties of undefined
      # (reading 'Cjs')"), but 6.1 would leave the supported range just as quietly,
      # and a major-only block does not stop it. 6.0.x patches still come through.
      # Recheck by reading typescript-eslint's peer range and raising this to its
      # new ceiling; drop the entry when it has none.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
    groups:
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "prettier-plugin-tailwindcss"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@vitejs/plugin-react"
          - "@testing-library/*"
          - "jsdom"
      linting:
        patterns:
          - "eslint"
          - "eslint-*"
          - "prettier"
          - "@commitlint/*"
          - "lint-staged"
          - "husky"
      types:
        patterns:
          - "@types/*"
      # Catch-alls, matched last. Every minor/patch bump not claimed by a group
      # above lands in one PR per dependency type instead of one per package,
      # which keeps review and CI cost bounded. Majors stay ungrouped so they
      # can be reviewed and reverted on their own.
      production-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 1
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
